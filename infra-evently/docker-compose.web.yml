services:
    web:
        image: ${WEB_IMAGE}:${WEB_TAG}
        build:
            context: ../web-evently
            dockerfile: Dockerfile
        platform: ${WEB_DOCKER_PLATFORM}
        container_name: ${WEB_CONTAINER_NAME}
        restart: unless-stopped
        environment:
            EVENTLY_UPSTREAM: ${HTTP_CONTAINER_NAME}:${HTTP_APP_PORT}
        ports:
            - "127.0.0.1:${WEB_APP_PORT}:80"
        networks:
            - internal_network

networks:
    internal_network:
        external: true
        name: ${NETWORK}
