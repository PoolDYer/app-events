services:
    mysql:
        image: mysql:8.0.35
        container_name: ${MYSQL_CONTAINER_NAME}
        restart: unless-stopped
        env_file:
            - .env
        environment:
            TZ: ${TZ}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: ${MYSQL_DATABASE}
        ports:
            - "127.0.0.1:3306:3306"
        healthcheck:
            test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
            interval: 5s
            timeout: 10s
            retries: 10
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - internal_network

volumes:
    mysql_data:
        name: ${MYSQL_VOLUME}

networks:
    internal_network:
        external: true
        name: ${NETWORK}
