services:
    redis:
        image: redis:8.2-alpine
        container_name: ${REDIS_CONTAINER_NAME}
        restart: unless-stopped
        ports:
            - "127.0.0.1:${REDIS_PORT}:6379"
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis_data:/data
        networks:
            - internal_network

volumes:
    redis_data:
        name: ${REDIS_VOLUME}

networks:
    internal_network:
        external: true
        name: ${NETWORK}
